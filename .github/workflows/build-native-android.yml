name: Build EW Bible App Native

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v4

      - name: Check files
        run: |
          for f in icon.png google-services.json; do
            [ -f "$f" ] || { echo "Missing $f"; exit 1; }
          done

      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: ew-bible-native-key

      - name: Create signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create Android project
        run: |
          set -e
          mkdir -p app/src/main/java/com/guzik/app app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp google-services.json app/google-services.json

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "EW Bible App"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
          }

          android {
            namespace 'com.guzik.app'
            compileSdk 35

            defaultConfig {
              applicationId "com.guzik.app"
              minSdk 28
              targetSdk 35
              versionCode 1
              versionName "1.0"
            }

            signingConfigs {
              debug {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }

            splits {
              abi {
                enable true
                reset()
                include 'armeabi-v7a', 'arm64-v8a'
                universalApk false
              }
            }

            buildTypes {
              debug { signingConfig signingConfigs.debug }
              release { minifyEnabled true; shrinkResources true }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          dependencies {
            implementation platform('com.google.firebase:firebase-bom:33.7.0')
            implementation 'com.google.firebase:firebase-auth'
            implementation 'com.google.firebase:firebase-firestore'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.credentials:credentials:1.3.0'
            implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
            implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
              android:label="@string/app_name"
              android:icon="@mipmap/ic_launcher"
              android:theme="@style/Theme.EWBibleApp">

              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">EW Bible App</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="Theme.EWBibleApp" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="20dp">

            <TextView
              android:id="@+id/welcome"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:text="Welcome to EW Bible App"
              android:textSize="24sp"
              android:textStyle="bold" />

            <Button
              android:id="@+id/googleButton"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginTop="24dp"
              android:text="Sign in with Google" />

            <Button
              android:id="@+id/logoutButton"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginTop="12dp"
              android:text="Log out" />

            <TextView
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:layout_marginTop="32dp"
              android:text="Settings"
              android:textSize="20sp"
              android:textStyle="bold" />

            <EditText
              android:id="@+id/fontSize"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginTop="12dp"
              android:hint="Font size"
              android:inputType="number" />

            <CheckBox
              android:id="@+id/darkMode"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:layout_marginTop="12dp"
              android:text="Dark mode" />

            <Button
              android:id="@+id/saveButton"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginTop="24dp"
              android:text="Save settings" />

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/guzik/app/MainActivity.java <<'EOF'
          package com.guzik.app;

          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.ContextCompat;
          import androidx.credentials.ClearCredentialStateRequest;
          import androidx.credentials.CredentialManager;
          import androidx.credentials.CredentialManagerCallback;
          import androidx.credentials.CustomCredential;
          import androidx.credentials.GetCredentialRequest;
          import androidx.credentials.GetCredentialResponse;
          import androidx.credentials.exceptions.ClearCredentialException;
          import androidx.credentials.exceptions.GetCredentialException;

          import com.google.android.libraries.identity.googleid.GetGoogleIdOption;
          import com.google.android.libraries.identity.googleid.GoogleIdTokenCredential;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.auth.FirebaseUser;
          import com.google.firebase.auth.GoogleAuthProvider;
          import com.google.firebase.firestore.FirebaseFirestore;

          import java.util.Map;

          public class MainActivity extends AppCompatActivity {

            private CredentialManager cm;
            private FirebaseAuth auth;
            private FirebaseFirestore db;

            private TextView welcome;
            private Button googleButton;
            private Button logoutButton;
            private EditText fontSize;
            private CheckBox darkMode;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              setContentView(R.layout.activity_main);

              cm = CredentialManager.create(this);
              auth = FirebaseAuth.getInstance();
              db = FirebaseFirestore.getInstance();

              welcome = findViewById(R.id.welcome);
              googleButton = findViewById(R.id.googleButton);
              logoutButton = findViewById(R.id.logoutButton);
              fontSize = findViewById(R.id.fontSize);
              darkMode = findViewById(R.id.darkMode);

              googleButton.setOnClickListener(v -> googleSignIn());
              logoutButton.setOnClickListener(v -> googleSignOut());

              findViewById(R.id.saveButton).setOnClickListener(v -> saveSettings());
              loadSettings();
            }

            private void googleSignIn() {
              GetGoogleIdOption option = new GetGoogleIdOption.Builder()
                .setServerClientId(getString(R.string.default_web_client_id))
                .setFilterByAuthorizedAccounts(false)
                .build();

              GetCredentialRequest request = new GetCredentialRequest.Builder()
                .addCredentialOption(option).build();

              cm.getCredentialAsync(this, request, new CancellationSignal(),
                ContextCompat.getMainExecutor(this),
                new CredentialManagerCallback<>() {
                  @Override public void onResult(GetCredentialResponse r) {
                    handle(r.getCredential());
                  }

                  @Override public void onError(GetCredentialException e) {
                    Toast.makeText(MainActivity.this, "Google sign-in cancelled", Toast.LENGTH_SHORT).show();
                  }
                });
            }

            private void handle(androidx.credentials.Credential c) {
              if (!(c instanceof CustomCredential) ||
                !GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL.equals(c.getType())) return;

              GoogleIdTokenCredential g = GoogleIdTokenCredential.createFrom(c.getData());

              auth.signInWithCredential(GoogleAuthProvider.getCredential(g.getIdToken(), null))
                .addOnCompleteListener(this, t -> {
                  if (t.isSuccessful()) updateUi();
                  else Toast.makeText(this, "Firebase sign-in failed", Toast.LENGTH_SHORT).show();
                });
            }

            private void googleSignOut() {
              auth.signOut();
              cm.clearCredentialStateAsync(new ClearCredentialStateRequest(),
                new CancellationSignal(),
                ContextCompat.getMainExecutor(this),
                new CredentialManagerCallback<>() {
                  @Override public void onResult(Void r) {}
                  @Override public void onError(ClearCredentialException e) {}
                });

              updateUi();
            }

            private void updateUi() {
              FirebaseUser u = auth.getCurrentUser();

              if (u != null && u.getEmail() != null) {
                welcome.setText("Welcome, " + u.getEmail());
                googleButton.setVisibility(android.view.View.GONE);
                logoutButton.setVisibility(android.view.View.VISIBLE);
                loadSettings();
              } else {
                welcome.setText("Welcome to EW Bible App");
                googleButton.setVisibility(android.view.View.VISIBLE);
                logoutButton.setVisibility(android.view.View.GONE);
              }
            }

            private void saveSettings() {
              FirebaseUser u = auth.getCurrentUser();
              if (u == null) {
                Toast.makeText(this, "Sign in to sync settings", Toast.LENGTH_SHORT).show();
                return;
              }

              db.collection("users").document(u.getUid())
                .set(Map.of(
                  "fontSize", fontSize.getText().toString(),
                  "darkMode", darkMode.isChecked()
                ))
                .addOnSuccessListener(r -> Toast.makeText(this, "Settings synced", Toast.LENGTH_SHORT).show())
                .addOnFailureListener(e -> Toast.makeText(this, "Sync failed", Toast.LENGTH_SHORT).show());
            }

            private void loadSettings() {
              FirebaseUser u = auth.getCurrentUser();
              if (u == null) return;

              db.collection("users").document(u.getUid()).get()
                .addOnSuccessListener(d -> {
                  if (!d.exists()) return;

                  fontSize.setText(d.getString("fontSize"));
                  Boolean dark = d.getBoolean("darkMode");
                  darkMode.setChecked(dark != null && dark);
                });
            }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          [ -f gradlew ] || gradle wrapper --gradle-version 8.10.2

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Show SHA-1
        run: ./gradlew :app:signingReport

      - uses: actions/upload-artifact@v5
        with:
          name: EW-Bible-App-Native-APK-debug
          path: |
            app/build/outputs/apk/debug/*armeabi-v7a*.apk
            app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
