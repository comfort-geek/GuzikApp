name: Build EW Bible App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Check required files
        run: |
          set -e
          for f in app2.html icon.png google-services.json; do
            [ -f "$f" ] || { echo "ERROR: Missing $f"; exit 1; }
          done

      - name: Add Google login to app2.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app2.html")
          h = p.read_text(encoding="utf-8")

          if 'id="googleAuthSection"' not in h:
              ui = '''<div id="googleAuthSection" style="padding:10px;border-bottom:1px solid #ddd;">
              <div id="googleLoginBox"><button onclick="if(window.AndroidAuth)AndroidAuth.googleSignIn()" style="width:100%;padding:12px;font-weight:bold;">Sign in with Google</button></div>
              <div id="googleWelcomeBox" style="display:none;"><b>Welcome, <span id="googleUserEmail"></span></b><br><button onclick="if(window.AndroidAuth)AndroidAuth.googleSignOut()" style="width:100%;padding:10px;margin-top:8px;">Log out</button></div>
              </div>'''

              js = '''<script>
              window.onGoogleSignInResult=function(ok,email){
                if(ok){
                  document.getElementById("googleLoginBox").style.display="none";
                  document.getElementById("googleWelcomeBox").style.display="block";
                  document.getElementById("googleUserEmail").textContent=email;
                  if(window.AndroidAuth)AndroidAuth.loadSettings();
                }else if(email){alert(email);}
              };

              window.onGoogleSignOut=function(){
                document.getElementById("googleWelcomeBox").style.display="none";
                document.getElementById("googleLoginBox").style.display="block";
              };

              window.onSettingsSaved=function(ok,msg){if(!ok)alert(msg);};

              window.onSettingsLoaded=function(ok,json){
                if(!ok||!json)return;
                try{console.log("Loaded settings:",JSON.parse(json));}catch(e){}
              };

              window.addEventListener("load",function(){
                if(window.AndroidAuth){
                  var email=AndroidAuth.getLoginState();
                  if(email){
                    document.getElementById("googleLoginBox").style.display="none";
                    document.getElementById("googleWelcomeBox").style.display="block";
                    document.getElementById("googleUserEmail").textContent=email;
                    AndroidAuth.loadSettings();
                  }
                }
              });
              </script>'''

              m = re.search(r"<body[^>]*>", h, re.I)
              pos = m.end() if m else 0
              h = h[:pos] + ui + h[pos:]

              if "</body>" in h:
                  h = h.replace("</body>", js + "</body>", 1)
              else:
                  h += js

              p.write_text(h, encoding="utf-8")
          PY

      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: ew-bible-debug-key

      - name: Create signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create Android project
        run: |
          set -e

          mkdir -p \
            app/src/main/java/com/guzik/app \
            app/src/main/assets \
            app/src/main/res/values \
            app/src/main/res/mipmap-mdpi \
            app/src/main/res/mipmap-hdpi \
            app/src/main/res/mipmap-xhdpi \
            app/src/main/res/mipmap-xxhdpi \
            app/src/main/res/mipmap-xxxhdpi

          cp debug.keystore app/debug.keystore
          cp google-services.json app/google-services.json
          cp app2.html app/src/main/assets/app2.html

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon.png "app/src/main/res/mipmap-$d/ic_launcher.png"
          done

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "EW Bible App"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.guzik.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.guzik.app"
                  minSdk 28
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              splits {
                  abi {
                      enable true
                      reset()
                      include 'armeabi-v7a', 'arm64-v8a'
                      universalApk true
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'

              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.credentials:credentials:1.3.0'
              implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
              implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
              implementation 'androidx.webkit:webkit:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.EWBibleApp"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode|density|fontScale">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">EW Bible App</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.EWBibleApp" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/guzik/app/MainActivity.java <<'EOF'
          package com.guzik.app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.ContextCompat;
          import androidx.core.view.WindowCompat;
          import androidx.credentials.ClearCredentialStateRequest;
          import androidx.credentials.CredentialManager;
          import androidx.credentials.CredentialManagerCallback;
          import androidx.credentials.CustomCredential;
          import androidx.credentials.GetCredentialRequest;
          import androidx.credentials.GetCredentialResponse;
          import androidx.credentials.exceptions.ClearCredentialException;
          import androidx.credentials.exceptions.GetCredentialException;

          import com.google.android.libraries.identity.googleid.GetGoogleIdOption;
          import com.google.android.libraries.identity.googleid.GoogleIdTokenCredential;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.auth.FirebaseUser;
          import com.google.firebase.auth.GoogleAuthProvider;
          import com.google.firebase.firestore.FirebaseFirestore;

          import org.json.JSONObject;

          import java.util.Map;

          public class MainActivity extends AppCompatActivity {

              private WebView web;
              private View full;
              private WebChromeClient.CustomViewCallback fullCallback;
              private LinearLayout root;
              private CredentialManager cm;
              private FirebaseAuth auth;
              private FirebaseFirestore db;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);

                  web = new WebView(this);
                  web.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                  ));

                  root.addView(web);
                  setContentView(root);

                  cm = CredentialManager.create(this);
                  auth = FirebaseAuth.getInstance();
                  db = FirebaseFirestore.getInstance();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebViewClient(new WebViewClient());

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (full != null) {
                              callback.onCustomViewHidden();
                              return;
                          }

                          full = view;
                          fullCallback = callback;
                          setContentView(view);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (full == null) {
                              return;
                          }

                          setContentView(root);

                          if (fullCallback != null) {
                              fullCallback.onCustomViewHidden();
                          }

                          full = null;
                          fullCallback = null;
                      }
                  });

                  getOnBackPressedDispatcher().addCallback(
                          this,
                          new androidx.activity.OnBackPressedCallback(true) {
                              @Override
                              public void handleOnBackPressed() {
                                  if (full != null) {
                                      if (fullCallback != null) {
                                          fullCallback.onCustomViewHidden();
                                      }

                                      full = null;
                                      fullCallback = null;
                                      setContentView(root);
                                      return;
                                  }

                                  if (web.canGoBack()) {
                                      web.goBack();
                                  } else {
                                      setEnabled(false);
                                  }
                              }
                          }
                  );

                  web.addJavascriptInterface(new Bridge(), "AndroidAuth");
                  web.loadUrl("file:///android_asset/app2.html");
              }

              private void js(String function, boolean success, String value) {
                  runOnUiThread(() -> web.evaluateJavascript(
                          function + "(" + success + ",\"" +
                                  value.replace("\"", "\\\"") + "\")",
                          null
                  ));
              }

              private void googleSignIn() {
                  GetGoogleIdOption option = new GetGoogleIdOption.Builder()
                          .setServerClientId(getString(R.string.default_web_client_id))
                          .setFilterByAuthorizedAccounts(false)
                          .build();

                  GetCredentialRequest request = new GetCredentialRequest.Builder()
                          .addCredentialOption(option)
                          .build();

                  cm.getCredentialAsync(
                          this,
                          request,
                          new CancellationSignal(),
                          ContextCompat.getMainExecutor(this),
                          new CredentialManagerCallback<
                                  GetCredentialResponse,
                                  GetCredentialException>() {

                              @Override
                              public void onResult(GetCredentialResponse result) {
                                  handleCredential(result.getCredential());
                              }

                              @Override
                              public void onError(GetCredentialException error) {
                                  js(
                                          "window.onGoogleSignInResult",
                                          false,
                                          "Google sign-in cancelled or failed."
                                  );
                              }
                          }
                  );
              }

              private void handleCredential(androidx.credentials.Credential credential) {
                  if (!(credential instanceof CustomCredential) ||
                          !GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL
                                  .equals(credential.getType())) {
                      js(
                              "window.onGoogleSignInResult",
                              false,
                              "Invalid Google credential."
                      );
                      return;
                  }

                  GoogleIdTokenCredential googleCredential =
                          GoogleIdTokenCredential.createFrom(credential.getData());

                  auth.signInWithCredential(
                          GoogleAuthProvider.getCredential(
                                  googleCredential.getIdToken(),
                                  null
                          )
                  ).addOnCompleteListener(this, task -> {
                      if (task.isSuccessful()) {
                          FirebaseUser user = auth.getCurrentUser();

                          String email = user != null && user.getEmail() != null
                                  ? user.getEmail()
                                  : "";

                          js("window.onGoogleSignInResult", true, email);
                          js("window.onSettingsLoaded", true, "");
                      } else {
                          js(
                                  "window.onGoogleSignInResult",
                                  false,
                                  "Firebase sign-in failed."
                          );
                      }
                  });
              }

              private class Bridge {

                  @JavascriptInterface
                  public void googleSignIn() {
                      runOnUiThread(() -> googleSignIn());
                  }

                  @JavascriptInterface
                  public void googleSignOut() {
                      auth.signOut();

                      cm.clearCredentialStateAsync(
                              new ClearCredentialStateRequest(),
                              new CancellationSignal(),
                              ContextCompat.getMainExecutor(MainActivity.this),
                              new CredentialManagerCallback<Void, ClearCredentialException>() {

                                  @Override
                                  public void onResult(Void result) {
                                  }

                                  @Override
                                  public void onError(ClearCredentialException error) {
                                  }
                              }
                      );

                      runOnUiThread(() -> web.evaluateJavascript(
                              "window.onGoogleSignOut()",
                              null
                      ));
                  }

                  @JavascriptInterface
                  public String getLoginState() {
                      FirebaseUser user = auth.getCurrentUser();

                      if (user == null || user.getEmail() == null) {
                          return "";
                      }

                      return user.getEmail();
                  }

                  @JavascriptInterface
                  public void saveSettings(String json) {
                      FirebaseUser user = auth.getCurrentUser();

                      if (user == null) {
                          js(
                                  "window.onSettingsSaved",
                                  false,
                                  "Sign in to sync settings."
                          );
                          return;
                      }

                      try {
                          JSONObject object = new JSONObject(json);

                          db.collection("users")
                                  .document(user.getUid())
                                  .set(Map.of("settings", object.toMap()))
                                  .addOnSuccessListener(result ->
                                          js(
                                                  "window.onSettingsSaved",
                                                  true,
                                                  "Settings synced."
                                          ))
                                  .addOnFailureListener(error ->
                                          js(
                                                  "window.onSettingsSaved",
                                                  false,
                                                  "Settings sync failed."
                                          ));
                      } catch (Exception error) {
                          js(
                                  "window.onSettingsSaved",
                                  false,
                                  "Invalid settings data."
                          );
                      }
                  }

                  @JavascriptInterface
                  public void loadSettings() {
                      FirebaseUser user = auth.getCurrentUser();

                      if (user == null) {
                          return;
                      }

                      db.collection("users")
                              .document(user.getUid())
                              .get()
                              .addOnSuccessListener(document -> {
                                  if (!document.exists()) {
                                      return;
                                  }

                                  Object settings = document.get("settings");

                                  if (settings != null) {
                                      js(
                                              "window.onSettingsLoaded",
                                              true,
                                              settings.toString()
                                      );
                                  }
                              });
                  }
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi

      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Show SHA-1 fingerprint
        run: |
          ./gradlew :app:signingReport

      - uses: actions/upload-artifact@v5
        with:
          name: EW-Bible-App-APK-debug
          path: |
            app/build/outputs/apk/debug/*armeabi-v7a*.apk
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
