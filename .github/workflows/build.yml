name: Build EW Bible App - ARM7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          ls -l
          test -f icon.png || (echo "Missing icon.png at root" && exit 1)
          test -f app2.html || (echo "Missing app2.html at root" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create EW Bible App project
        run: |
          mkdir -p app/src/main/java/com/ewbible/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Icon
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon.png "app/src/main/res/mipmap-$d/ic_launcher.png"
          done

          # HTML
          cp app2.html app/src/main/assets/app2.html

          # Manifest
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:allowBackup="true"
              android:label="EW Bible App"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:supportsRtl="true">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          # MainActivity
          cat > app/src/main/java/com/ewbible/app/MainActivity.java <<'EOF'
          package com.ewbible.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView webView = new WebView(this);
              webView.getSettings().setJavaScriptEnabled(true);
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/app2.html");
              setContentView(webView);
            }
          }
          EOF

          # Root build.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.application:com.android.application:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # App build.gradle - ARM7 ONLY
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ewbible.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.ewbible.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            splits {
              abi {
                enable true
                reset()
                include 'armeabi-v7a'
                universalApk false
              }
            }
            buildTypes {
              release { minifyEnabled false }
              debug { minifyEnabled false }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

      - name: Build Debug APK
        run: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --stacktrace

      - name: Upload ARM7 APK
        uses: actions/upload-artifact@v4
        with:
          name: EW-Bible-App-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
