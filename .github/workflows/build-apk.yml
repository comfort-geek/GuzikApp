name: Build EW Study Bible APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Inject AndroidX and Gradle Configurations
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Generate Core Android Framework Files Natively
        run: |
          # 1. Create directory paths for Manifest, Source code, build files, and launcher icons
          mkdir -p app/src/main/
          mkdir -p app/src/main/java/com/guzik/app/
          mkdir -p app/src/main/res/mipmap-mdpi/
          mkdir -p app/src/main/res/mipmap-hdpi/
          mkdir -p app/src/main/res/mipmap-xhdpi/
          mkdir -p app/src/main/res/mipmap-xxhdpi/
          mkdir -p app/src/main/res/mipmap-xxxhdpi/

          # 2. Generate a valid module-level build.gradle file
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.guzik.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.guzik.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # 3. Write a validated AndroidManifest.xml using corrected Base64 encoding (Updated App Name and Icon reference)
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          
          # Inject the native theme parameter explicitly into the XML
          sed -i 's|@value|@android:style/Theme.DeviceDefault.NoActionBar|g' app/src/main/AndroidManifest.xml

          # 4. Write pure native MainActivity.java with lightning-fast splash and load optimizations
          cat << 'EOF' > app/src/main/java/com/guzik/app/MainActivity.java
          package com.guzik.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          public class MainActivity extends Activity {
              private WebView webView;
              private FrameLayout rootLayout;
              private ImageView splashImageView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // 1. Performance: Initialize container and ultra-light splash view instantly
                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(0xFFFFFFFF); // Matches system light mode background

                  splashImageView = new ImageView(this);
                  int iconResId = getResources().getIdentifier("ic_launcher", "mipmap", getPackageName());
                  if (iconResId != 0) {
                      splashImageView.setImageResource(iconResId);
                  }
                  
                  // Layout layout properties to perfectly center the icon image
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                  );
                  lp.gravity = android.view.Gravity.CENTER;
                  splashImageView.setLayoutParams(lp);
                  rootLayout.addView(splashImageView);

                  // 2. Performance: Pre-load the WebView silently behind the scenes
                  webView = new WebView(this);
                  webView.setVisibility(View.INVISIBLE);
                  rootLayout.addView(webView);
                  setContentView(rootLayout);

                  // 3. Performance Settings: Optimize options to increase script parsing speed
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);

                  // Cache performance boosts for immediate offline storage response time
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          // Code keeps checking if page is parsed early
                      }
                  });

                  webView.loadUrl("file:///android_asset/app2.html");

                  // 4. Flash Layer: Clear screen overlay precisely after exactly 1 second (1000 milliseconds)
                  new Handler().postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (!isFinishing()) {
                              splashImageView.setVisibility(View.GONE);
                              webView.setVisibility(View.VISIBLE);
                              rootLayout.removeView(splashImageView);
                          }
                      }
                  }, 1000);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create Assets Folder and Copy HTML
        run: |
          mkdir -p app/src/main/assets/
          cp app2.html app/src/main/assets/app2.html
          echo "Copied asset layout folder structures directly."

          # Copy icon.png safely across all target Android density subdirectories
          if [ -f "icon.png" ]; then
              echo "icon.png found at root folder. Injecting app launcher icons..."
              for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                  cp icon.png app/src/main/res/$folder/ic_launcher.png
              done
          else
              echo "Warning: icon.png not found at root repository path. Deploying fallback resource."
              for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                  echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/$folder/ic_launcher.png
              done
          fi

      - name: Build APK
        run: gradle :app:assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EW-Study-Bible-APK
          path: app/build/outputs/apk/debug/app-debug.apk
