name: EW Study Bible APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Inject AndroidX and Gradle Configurations
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Generate Core Android Framework Files Natively
        run: |
          # 1. Ensure basic root configurations exist
          echo "include ':app'" > settings.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 2. Create directory paths for Manifest, Source code, and resource directories
          mkdir -p app/src/main/
          mkdir -p app/src/main/java/com/guzik/app/
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 3. Generate module-level build.gradle file with SourceSet resource mapping
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.guzik.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.guzik.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              sourceSets {
                  main {
                      res.srcDirs = ['src/main/res']
                  }
              }
          }
          EOF

          # 4. Corrected AndroidManifest.xml using the strict official schema URL path
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="EW Study Bible"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity 
                      android:name="com.guzik.app.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Write pure native MainActivity.java using standard android.app.Activity
          cat << 'EOF' > app/src/main/java/com/guzik/app/MainActivity.java
          package com.guzik.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.File;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createFolders();
                  
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/app2.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private void createFolders() {
                  String[] folders = {"EW Study Bible/Bible", "EW Study Bible/Commentary", "EW Study Bible/Notes", "EW Study Bible/Highlights", "EW Study Bible/Audio", "EW Study Bible/Downloads", "EW Study Bible/Backups"};
                  for (String f : folders) {
                      File dir = new File(getFilesDir(), f);
                      if (!dir.exists()) dir.mkdirs();
                      File ext = new File(getExternalFilesDir(null), f);
                      if (ext != null && !ext.exists()) ext.mkdirs();
                  }
              }
          }
          EOF

      - name: Create Assets Folder and Copy HTML
        run: |
          mkdir -p app/src/main/assets/
          if [ -f "app2.html" ]; then
            cp app2.html app/src/main/assets/app2.html
            echo "Copied app2.html asset into build tree."
          else
            echo "<html><body><h1>EW Study Bible</h1><p>app2.html missing - add file to repo root</p></body></html>" > app/src/main/assets/app2.html
            echo "Warning: app2.html not detected at root, deployed placeholder."
          fi

          # Icon handling layer integrated safely to populate launcher resources
          if [ -f "icon.png" ]; then
            echo "Custom icon.png detected! Injected into resource buckets."
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do cp icon.png app/src/main/res/$d/ic_launcher.png; done
          elif [ -f "icon.jpg" ]; then
            echo "Custom icon.jpg detected! Injected into resource buckets."
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do cp icon.jpg app/src/main/res/$d/ic_launcher.png; done
          else
            echo "No custom icon detected at root. Constructing minimal fallback asset."
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/$d/ic_launcher.png
            done
          fi

      - name: Build APK
        run: gradle :app:assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EW-Study-Bible-APK
          path: app/build/outputs/apk/debug/app-debug.apk
