name: Build EW Study Bible APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Inject Firebase Configuration File
        run: |
          # Generate the google-services.json file inside the app module
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "515882116644",
              "firebase_url": "https://guzikapp-6c7c6-default-rtdb.firebaseio.com",
              "project_id": "guzikapp-6c7c6",
              "storage_bucket": "guzikapp-6c7c6.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:515882116644:android:fe2f8a4614ffb5efe79ab1",
                  "android_client_info": {
                    "package_name": "com.guzik.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "515882116644-09lubulqpqbc1bl8177qrk4opedub2md.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyC0MLfJymxgcpVDP58fu3btbweBvFegyTU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "515882116644-09lubulqpqbc1bl8177qrk4opedub2md.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Inject Custom MainActivity Java Code
        run: |
          cat << 'EOF' > app/src/main/java/com/guzik/app/MainActivity.java
          package com.guzik.app;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.widget.Toast;
          import androidx.core.app.NotificationCompat;
          import java.util.Calendar;

          public class MainActivity extends Activity {
              private WebView webView;
              private long lastBack = 0;

              public static class NotifReceiver extends BroadcastReceiver {
                  @Override public void onReceive(Context ctx, Intent intent) {
                      String title = intent.getStringExtra("title");
                      String body = intent.getStringExtra("body");
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) {
                          nm.createNotificationChannel(new NotificationChannel("bible", "Bible Notifications", NotificationManager.IMPORTANCE_DEFAULT));
                      }
                      Intent open = new Intent(ctx, MainActivity.class);
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, "bible")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title).setContentText(body)
                          .setContentIntent(pi).setAutoCancel(true);
                      nm.notify((int)System.currentTimeMillis(), b.build());
                  }
              }

              public class NotifBridge {
                  @JavascriptInterface public void scheduleNotif(int id, int hour, int minute, String title, String body) {
                      AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                      Intent i = new Intent(MainActivity.this, NotifReceiver.class);
                      i.putExtra("title", title); i.putExtra("body", body);
                      PendingIntent pi = PendingIntent.getBroadcast(MainActivity.this, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      Calendar c = Calendar.getInstance();
                      c.set(Calendar.HOUR_OF_DAY, hour); c.set(Calendar.MINUTE, minute); c.set(Calendar.SECOND, 0);
                      if (c.getTimeInMillis() < System.currentTimeMillis()) c.add(Calendar.DAY_OF_YEAR, 1);
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, c.getTimeInMillis(), pi);
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "Notification set: " + hour + ":" + minute, Toast.LENGTH_SHORT).show());
                  }
              }

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED, WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String{android.Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
                  registerReceiver(new NotifReceiver(), new IntentFilter("BIBLE_NOTIF"), Context.RECEIVER_EXPORTED);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true); ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true); ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);
                  
                  ws.setJavaScriptCanOpenWindowsAutomatically(true);
                  ws.setSupportMultipleWindows(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  
                  webView.loadUrl("file:///android_asset/app2.html");
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      if (System.currentTimeMillis() - lastBack < 2000) { super.onBackPressed(); }
                      else { lastBack = System.currentTimeMillis(); Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show(); }
                      return;
                  }
                  if (System.currentTimeMillis() - lastBack < 2000) { super.onBackPressed(); }
                  else { lastBack = System.currentTimeMillis(); Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show(); }
              }
          }
          EOF

      - name: Force App Name, Firebase Dependencies, and Overwrite Icons
        run: |
          mkdir -p app/src/main/assets/
          mkdir -p app/src/main/res/values/
          mkdir -p app/src/main/res/drawable/
          
          # Explicitly set app name resource
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">EW Study Bible</string></resources>' > app/src/main/res/values/strings.xml

          # Copy icon.png to every possible target filename configuration to guarantee it gets picked up
          if [ -f "icon.png" ]; then
              cp icon.png app/src/main/res/drawable/ic_launcher.png
              cp icon.png app/src/main/res/drawable/icon.png
              for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                  mkdir -p app/src/main/res/$folder/
                  cp icon.png app/src/main/res/$folder/ic_launcher.png
                  cp icon.png app/src/main/res/$folder/ic_launcher_round.png
              done
          fi

          # Rewrite Manifest references to lock onto our forced configurations directly
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
              sed -i 's|android:label="[^"]*"|android:label="@string/app_name"|g' app/src/main/AndroidManifest.xml
              sed -i 's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|g' app/src/main/AndroidManifest.xml
              sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
          fi

          # Apply the Google Services classpath plugin to the root build.gradle if not present
          if ! grep -q "com.google.gms:google-services" build.gradle; then
              sed -i "/dependencies {/a \        classpath 'com.google.gms:google-services:4.4.1'" build.gradle
          fi

