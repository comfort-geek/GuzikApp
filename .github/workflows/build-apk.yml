name: EW Study Bible APK

on:

  push:

    branches: [ main ]

  workflow_dispatch:

 

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

 

      - uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '17'

          cache: ''

 

      - uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: '8.5'

          cache-disabled: true

 

      - name: Inject AndroidX and Gradle Configurations

        run: |

          echo "android.useAndroidX=true" >> gradle.properties

          echo "android.enableJetifier=true" >> gradle.properties

          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

 

      - name: Generate Core Android Framework Files Natively

        run: |

          mkdir -p app/src/main/java/com/guzik/app/

          mkdir -p app/src/main/assets/bible

          mkdir -p app/src/main/assets/commentary

          mkdir -p app/src/main/res/mipmap-mdpi

          mkdir -p app/src/main/res/mipmap-hdpi

          mkdir -p app/src/main/res/mipmap-xhdpi

          mkdir -p app/src/main/res/mipmap-xxhdpi

          mkdir -p app/src/main/res/mipmap-xxxhdpi

 

          cat << 'EOF' > app/build.gradle

          plugins {

              id 'com.android.application'

          }

          android {

              namespace 'com.guzik.app'

              compileSdk 34

              defaultConfig {

                  applicationId "com.guzik.app"

                  minSdk 24

                  targetSdk 34

                  versionCode 2

                  versionName "2.0"

              }

              buildTypes {

                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

          }

          dependencies {

              implementation 'androidx.appcompat:appcompat:1.6.1'

              implementation 'androidx.webkit:webkit:1.9.0'

          }

          EOF

 

          cat << 'EOF' > app/src/main/AndroidManifest.xml

          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:largeHeap="true"

                  android:label="EW Study Bible"

                  android:icon="@mipmap/ic_launcher"

                  android:roundIcon="@mipmap/ic_launcher"

                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"

                  android:usesCleartextTraffic="true">

                  <activity

                      android:name="com.guzik.app.MainActivity"

                      android:exported="true"

                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF

 

          cat << 'EOF' > app/src/main/java/com/guzik/app/MainActivity.java

          package com.guzik.app;

          import android.app.Activity;

          import android.os.Bundle;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;

          import java.io.File;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override

              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  createFolders();

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings s = webView.getSettings();

                  s.setJavaScriptEnabled(true);

                  s.setDomStorageEnabled(true);

                  s.setDatabaseEnabled(true);

                  s.setCacheMode(WebSettings.LOAD_CACHE_ELSE_NETWORK);

                  s.setAppCacheEnabled(true);

                  s.setAppCachePath(getCacheDir().getAbsolutePath());

                  s.setAllowFileAccess(true);

                  s.setAllowContentAccess(true);

                  s.setAllowFileAccessFromFileURLs(true);

                  s.setAllowUniversalAccessFromFileURLs(true);

                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  s.setLoadsImagesAutomatically(true);

                  s.setRenderPriority(WebSettings.RenderPriority.HIGH);

                  webView.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/app2.html");

              }

              private void createFolders() {

                  String[] folders = {"EW Study Bible/Bible", "EW Study Bible/Commentary", "EW Study Bible/Notes", "EW Study Bible/Highlights", "EW Study Bible/Audio", "EW Study Bible/Downloads", "EW Study Bible/Backups"};

                  for (String f : folders) {

                      File dir = new File(getFilesDir(), f);

                      if (!dir.exists()) dir.mkdirs();

                      File ext = new File(getExternalFilesDir(null), f);

                      if (ext != null && !ext.exists()) ext.mkdirs();

                  }

              }

              @Override

              public void onBackPressed() {

                  if (webView.canGoBack()) webView.goBack();

                  else super.onBackPressed();

              }

          }

          EOF

 

      - name: Create Assets and Icon

        run: |

          mkdir -p app/src/main/assets/

          if [ -f "app2.html" ]; then

            cp app2.html app/src/main/assets/app2.html

          else

            echo "<html><body><h1>EW Study Bible</h1><p>app2.html missing - add file to repo root</p></body></html>" > app/src/main/assets/app2.html

          fi

 

          # Icon - if you have icon.png or icon.jpg in repo root, use it, else create placeholder so build doesn't fail

          if [ -f "icon.png" ]; then

            echo "Using icon.png"

            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do cp icon.png app/src/main/res/$d/ic_launcher.png; done

          elif [ -f "icon.jpg" ]; then

            echo "Using icon.jpg"

            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do cp icon.jpg app/src/main/res/$d/ic_launcher.png; done

          else

            echo "No custom icon - creating placeholder icon so manifest parsing doesn't fail"

            # Create a 1x1 transparent png placeholder for each density using base64

            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do

              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/$d/ic_launcher.png

            done

          fi

          ls -R app/src/main/res/

 

      - name: Build APK

        run: gradle :app:assembleDebug -Pandroid.useAndroidX=true --stacktrace

 

      - name: Upload APK

        uses: actions/upload-artifact@v4

        with:

          name: EW-Study-Bible-APK

          path: app/build/outputs/apk/debug/app-debug.apk
