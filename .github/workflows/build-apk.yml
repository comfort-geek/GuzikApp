name: Build EW Study Bible APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Copy Assets and Launcher Icons into App Module
        run: |
          # Ensure target asset and resource directories exist inside your existing app folder
          mkdir -p app/src/main/assets/
          mkdir -p app/src/main/res/mipmap-mdpi/
          mkdir -p app/src/main/res/mipmap-hdpi/
          mkdir -p app/src/main/res/mipmap-xhdpi/
          mkdir -p app/src/main/res/mipmap-xxhdpi/
          mkdir -p app/src/main/res/mipmap-xxxhdpi/

          # Copy your main HTML file from the root folder into the compilation assets
          cp app2.html app/src/main/assets/app2.html
          
          # Inject the JavaScript notification bridge function right before the closing body tag
          sed -i 's|</body>|<script>function saveNotifTimes(){ var vt = document.getElementById("nt-verse-time").value.split(":"); var rt = document.getElementById("nt-rem-time").value.split(":"); if(window.AndroidNotif){ AndroidNotif.scheduleNotif(1, parseInt(vt), parseInt(vt), "📖 Daily Verse", "Open EW Study Bible for todays verse"); AndroidNotif.scheduleNotif(2, parseInt(rt), parseInt(rt), "⏰ Bible Reminder", "Time to read your Bible"); } else { alert("In APK only - test after build"); } }</script></body>|g' app/src/main/assets/app2.html

          # Copy your root icon.png cleanly into all targeted Android launcher densities
          if [ -f "icon.png" ]; then
              for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                  cp icon.png app/src/main/res/$folder/ic_launcher.png
              done
          else
              for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                  echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/$folder/ic_launcher.png
              done
          fi

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EW-Study-Bible-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
