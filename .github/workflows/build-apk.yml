name: Build EW Study Bible APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Inject AndroidX and Gradle configurations
        run: |
          cat >> gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "EW Study Bible"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          // Root build file.
          // Repositories are centralized in settings.gradle.
          EOF

      - name: Generate Android app files
        run: |
          mkdir -p app/src/main/java/com/guzik/app
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

                    cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0'
              id 'com.google.gms.google-services' version '4.4.2'
          }

          android {
              namespace 'com.guzik.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.guzik.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.12.0'

              implementation platform('com.google.firebase:firebase-bom:33.1.2')
              implementation 'com.google.firebase:firebase-auth'
          }
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">EW Study Bible</string>
          </resources>
          EOF

          if [ -f icon.png ]; then
            for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp icon.png "app/src/main/res/$folder/ic_launcher.png"
              cp icon.png "app/src/main/res/$folder/ic_launcher_round.png"
            done
          else
            echo "Warning: icon.png not found. Using Android default icon is not possible without a launcher icon resource."
            exit 1
          fi

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name="com.guzik.app.MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name="com.guzik.app.MainActivity$NotifReceiver"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="BIBLE_NOTIF" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/guzik/app/MainActivity.java << 'EOF'
          package com.guzik.app;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.NotificationCompat;
          import java.util.Calendar;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  hideSystemUI();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDomStorageEnabled(true);

                  webView.addJavascriptInterface(new WebNotificationBridge(this), "AndroidNotif");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/app2.html");

                  createNotificationChannel();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemUI();
              }

              private void hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      );
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              "BIBLE_CHANNEL",
                              "Bible Notifications",
                              NotificationManager.IMPORTANCE_DEFAULT
                      );

                      NotificationManager manager = getSystemService(NotificationManager.class);

                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              public class WebNotificationBridge {

                  private final Context context;

                  WebNotificationBridge(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public void scheduleNotif(
                          int id,
                          int hour,
                          int minute,
                          String title,
                          String message
                  ) {
                      Intent intent = new Intent(context, NotifReceiver.class);
                      intent.setAction("BIBLE_NOTIF");
                      intent.putExtra("id", id);
                      intent.putExtra("title", title);
                      intent.putExtra("message", message);

                      PendingIntent pendingIntent = PendingIntent.getBroadcast(
                              context,
                              id,
                              intent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      AlarmManager alarmManager =
                              (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);

                      Calendar calendar = Calendar.getInstance();
                      calendar.set(Calendar.HOUR_OF_DAY, hour);
                      calendar.set(Calendar.MINUTE, minute);
                      calendar.set(Calendar.SECOND, 0);

                      if (calendar.before(Calendar.getInstance())) {
                          calendar.add(Calendar.DATE, 1);
                      }

                      if (alarmManager != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              alarmManager.setExactAndAllowWhileIdle(
                                      AlarmManager.RTC_WAKEUP,
                                      calendar.getTimeInMillis(),
                                      pendingIntent
                              );
                          } else {
                              alarmManager.setExact(
                                      AlarmManager.RTC_WAKEUP,
                                      calendar.getTimeInMillis(),
                                      pendingIntent
                              );
                          }
                      }
                  }
              }

              public static class NotifReceiver extends BroadcastReceiver {

                  @Override
                  public void onReceive(Context context, Intent intent) {
                      int id = intent.getIntExtra("id", 0);
                      String title = intent.getStringExtra("title");
                      String message = intent.getStringExtra("message");

                      NotificationCompat.Builder builder =
                              new NotificationCompat.Builder(context, "BIBLE_CHANNEL")
                                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                                      .setContentTitle(title)
                                      .setContentText(message)
                                      .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                                      .setAutoCancel(true);

                      NotificationManager manager =
                              (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);

                      if (manager != null) {
                          manager.notify(id, builder.build());
                      }
                  }
              }
          }
          EOF

      - name: Create assets and copy HTML
        run: |
          if [ ! -f app2.html ]; then
            cat > app2.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>EW Study Bible</title>
          </head>
          <body>
              <h1>EW Study Bible</h1>
              <p>Welcome</p>
          EOF
          fi

          cat > script_bridge.js << 'EOF'
          <script>
          function saveNotifTimes() {
              var verseTime = document.getElementById('nt-verse-time').value.split(':');
              var reminderTime = document.getElementById('nt-rem-time').value.split(':');

              if (window.AndroidNotif) {
                  AndroidNotif.scheduleNotif(
                      1,
                      parseInt(verseTime[0]),
                      parseInt(verseTime[1]),
                      "Daily Verse",
                      "Open EW Study Bible for today's verse"
                  );

                  AndroidNotif.scheduleNotif(
                      2,
                      parseInt(reminderTime[0]),
                      parseInt(reminderTime[1]),
                      "Bible Reminder",
                      "Time to read your Bible"
                  );
              } else {
                  alert("Notifications are available in the installed APK.");
              }
          }
          </script>
          </body>
          </html>
          EOF

          sed -i 's|</body>||g' app2.html
          sed -i 's|</html>||g' app2.html

          cat app2.html script_bridge.js > app/src/main/assets/app2.html

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Show signing certificate fingerprints
        run: ./gradlew :app:signingReport

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
