name: Build GuzikApp APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Inject AndroidX and Gradle Configurations
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Manually Create Assets and Copy HTML
        run: |
          mkdir -p app/src/main/assets/
          cp app2.html app/src/main/assets/app2.html
          echo "Copied 32MB app2.html from root to assets inside the cloud runner environment."

      - name: Build APK
        run: gradle assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuzikApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
