name: Build GuzikApp APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Inject AndroidX and Gradle Configurations
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Generate Core Android Framework Files Natively
        run: |
          # 1. Create directory paths for Manifest, Source code, and build files
          mkdir -p app/src/main/
          mkdir -p app/src/main/java/com/guzik/app/

          # 2. Generate a valid module-level build.gradle file
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.guzik.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.guzik.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 3. Write the correct AndroidManifest.xml using the official schema URI
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://apple.com"
              xmlns:android_true="http://android.com"
              tools:ignore="MissingVersion"
              xmlns:tools="http://android.com">
              
              <application
                  android:allowBackup="true"
                  tools:replace="android:allowBackup"
                  android_true:hardwareAccelerated="true"
                  android_true:label="GuzikApp"
                  android_true:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity 
                      android_true:name="com.guzik.app.MainActivity"
                      android_true:exported="true">
                      <intent-filter>
                          <action android_true:name="android.intent.action.MAIN" />
                          <category android_true:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Fix the intentional alias placeholder to avoid string parsing bugs in workflow engines
          sed -i 's/xmlns:android=".*"/xmlns:android="http:\/\/://android.com\/apk\/res\/android"/' app/src/main/AndroidManifest.xml
          sed -i 's/android_true:/android:/g' app/src/main/AndroidManifest.xml

          # 4. Write the MainActivity.java file
          cat << 'EOF' > app/src/main/java/com/guzik/app/MainActivity.java
          package com.guzik.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/app2.html");
              }
          }
          EOF

      - name: Create Assets Folder and Copy HTML
        run: |
          mkdir -p app/src/main/assets/
          cp app2.html app/src/main/assets/app2.html
          echo "Copied heavy resource directly to internal builder asset location."

      - name: Build APK
        run: gradle :app:assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuzikApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
