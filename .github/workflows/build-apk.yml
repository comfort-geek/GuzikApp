name: Build EW Study Bible APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Inject Firebase Configuration File
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "515882116644",
              "firebase_url": "https://firebaseio.com",
              "project_id": "guzikapp-6c7c6",
              "storage_bucket": "guzikapp-6c7c6.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:515882116644:android:fe2f8a4614ffb5efe79ab1",
                  "android_client_info": { "package_name": "com.guzik.app" }
                },
                "oauth_client": [
                  {
                    "client_id": "://googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  { "current_key": "AIzaSyC0MLfJymxgcpVDP58fu3btbweBvFegyTU" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "://googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - name: Inject Custom MainActivity Java Code
        run: |
          echo "" | base64 -d > app/src/main/java/com/guzik/app/MainActivity.java
      - name: Overwrite Application Icons and Resource Strings
        run: |
          mkdir -p app/src/main/assets/ app/src/main/res/values/ app/src/main/res/drawable/
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">EW Study Bible</string></resources>' > app/src/main/res/values/strings.xml
          if [ -f "icon.png" ]; then
              cp icon.png app/src/main/res/drawable/ic_launcher.png || true
              cp icon.png app/src/main/res/drawable/icon.png || true
              for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                  mkdir -p app/src/main/res/$folder/
                  cp icon.png app/src/main/res/$folder/ic_launcher.png || true
                  cp icon.png app/src/main/res/$folder/ic_launcher_round.png || true
              done
          fi
      - name: Configure GMS Ecosystem Classpaths
        run: |
          if ! grep -q "com.google.gms:google-services" http://build.gradle; then
              sed -i "/dependencies {/a \        classpath 'com.google.gms:google-services:4.4.1'" http://build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" app/build.gradle; then
              echo "apply plugin: 'com.google.gms.google-services'" >> app/build.gradle
          fi
      - name: Copy HTML to Assets
        run: cp app2.html app/src/main/assets/app2.html
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EW-Study-Bible-APK
          path: app/build/outputs/apk/debug/app-debug.apk
