name: Build EW Study Bible APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Inject AndroidX and Gradle Configurations
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "include ':app'" > settings.gradle

      - name: Generate Core Android Framework Files Natively
        run: |
          # 1. Create directory paths for components
          mkdir -p app/src/main/
          mkdir -p app/src/main/java/com/guzik/app/
          mkdir -p app/src/main/res/mipmap-mdpi/
          mkdir -p app/src/main/res/mipmap-hdpi/
          mkdir -p app/src/main/res/mipmap-xhdpi/
          mkdir -p app/src/main/res/mipmap-xxhdpi/
          mkdir -p app/src/main/res/mipmap-xxxhdpi/

          # 2. Generate module-level build.gradle with AndroidX Core dependencies
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.guzik.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.guzik.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF

          # 3. Generate AndroidManifest.xml with necessary permissions and receivers
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="EW Study Bible"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  
                  <activity 
                      android:name="com.guzik.app.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver 
                      android:name="com.guzik.app.MainActivity$NotifReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="BIBLE_NOTIF" />
                      </intent-filter>
                  </receiver>
                  
              </application>
          </manifest>
          EOF

          # 4. Write the advanced Notification and JavaScript Bridge enabled MainActivity.java
          cat << 'EOF' > app/src/main/java/com/guzik/app/MainActivity.java
          package com.guzik.app;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.core.app.NotificationCompat;
          import java.util.Calendar;

          public class MainActivity extends Activity {
              private WebView webView;
              private long lastBack = 0;

              public static class NotifReceiver extends BroadcastReceiver {
                  @Override public void onReceive(Context ctx, Intent intent) {
                      String title = intent.getStringExtra("title");
                      String body = intent.getStringExtra("body");
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) {
                          nm.createNotificationChannel(new NotificationChannel("bible", "Bible Notifications", NotificationManager.IMPORTANCE_DEFAULT));
                      }
                      Intent open = new Intent(ctx, MainActivity.class);
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, "bible")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title).setContentText(body)
                          .setContentIntent(pi).setAutoCancel(true);
                      nm.notify((int)System.currentTimeMillis(), b.build());
                  }
              }

              public class NotifBridge {
                  @JavascriptInterface public void scheduleNotif(int id, int hour, int minute, String title, String body) {
                      AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                      Intent i = new Intent(MainActivity.this, NotifReceiver.class);
                      i.putExtra("title", title); i.putExtra("body", body);
                      PendingIntent pi = PendingIntent.getBroadcast(MainActivity.this, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      Calendar c = Calendar.getInstance();
                      c.set(Calendar.HOUR_OF_DAY, hour); c.set(Calendar.MINUTE, minute); c.set(Calendar.SECOND, 0);
                      if (c.getTimeInMillis() < System.currentTimeMillis()) c.add(Calendar.DAY_OF_YEAR, 1);
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, c.getTimeInMillis(), pi);
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "Notification set: " + hour + ":" + minute, Toast.LENGTH_SHORT).show());
                  }
              }

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED, WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
                  registerReceiver(new NotifReceiver(), new IntentFilter("BIBLE_NOTIF"), Context.RECEIVER_EXPORTED);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true); ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true); ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.addJavascriptInterface(new NotifBridge(), "AndroidNotif");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/app2.html");
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      if (System.currentTimeMillis() - lastBack < 2000) { super.onBackPressed(); }
                      else { lastBack = System.currentTimeMillis(); Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show(); }
                      return;
                  }
                  if (System.currentTimeMillis() - lastBack < 2000) { super.onBackPressed(); }
                  else { lastBack = System.currentTimeMillis(); Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show(); }
              }
          }
          EOF

      - name: Create Assets Folder and Copy/Modify HTML
        run: |
          mkdir -p app/src/main/assets/
          
          # Write JS patch code safely into a temp file
          cat << 'EOF' > patch.js
          <script>
          function saveNotifTimes(){
            var vt = document.getElementById('nt-verse-time').value.split(':');
            var rt = document.getElementById('nt-rem-time').value.split(':');
            if(window.AndroidNotif){
              AndroidNotif.scheduleNotif(1, parseInt(vt[0]), parseInt(vt[1]), "📖 Daily Verse", "Open EW Study Bible for today's verse");
