name: Build EW Study Bible APK

on:

  push:

    branches: [ main ]

  workflow_dispatch:

 

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

 

      - uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '17'

 

      - uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: '8.5'

          cache-disabled: true

 

      - name: Inject AndroidX and Gradle Configurations

        run: |

          echo "android.useAndroidX=true" >> gradle.properties

          echo "android.enableJetifier=true" >> gradle.properties

          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

 

      - name: Generate Core Android Framework Files Natively

        run: |

          # 1. Create directory paths

          mkdir -p app/src/main/java/com/guzik/app

          mkdir -p app/src/main/res/mipmap-mdpi

          mkdir -p app/src/main/res/mipmap-hdpi

          mkdir -p app/src/main/res/mipmap-xhdpi

          mkdir -p app/src/main/res/mipmap-xxhdpi

          mkdir -p app/src/main/res/mipmap-xxxhdpi

          mkdir -p app/src/main/res/values

          mkdir -p app/src/main/assets/bible

          mkdir -p app/src/main/assets/commentary

          mkdir -p app/src/main/assets/notes

          mkdir -p app/src/main/assets/highlights

          mkdir -p app/src/main/assets/audio

          mkdir -p app/src/main/assets/downloads

 

          # 2. Root build.gradle - FIXED

          cat > build.gradle << 'EOF'

          buildscript {

              repositories { google(); mavenCentral() }

              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }

          }

          allprojects {

              repositories { google(); mavenCentral() }

          }

          EOF

 

          cat > settings.gradle << 'EOF'

          include ':app'

          EOF

 

          # 3. App build.gradle - EW Study Bible

          cat > app/build.gradle << 'EOF'

          apply plugin: 'com.android.application'

          android {

              namespace 'com.guzik.app'

              compileSdk 34

              defaultConfig {

                  applicationId 'com.guzik.app'

                  minSdk 24

                  targetSdk 34

                  versionCode 2

                  versionName '2.0'

              }

              buildTypes {

                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

          }

          dependencies {

              implementation 'androidx.appcompat:appcompat:1.6.1'

              implementation 'androidx.webkit:webkit:1.9.0'

          }

          EOF

 

          # 4. AndroidManifest

          cat > app/src/main/AndroidManifest.xml << 'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />

              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

              <application

                  android:label="EW Study Bible"

                  android:icon="@mipmap/ic_launcher"

                  android:roundIcon="@mipmap/ic_launcher"

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:largeHeap="true"

                  android:usesCleartextTraffic="true">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF

 

          # 5. MainActivity - FASTER LOADING + AUTO FOLDERS

          cat > app/src/main/java/com/guzik/app/MainActivity.java << 'EOF'

          package com.guzik.app;

          import android.app.Activity;

          import android.os.Bundle;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;

          import java.io.File;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override

              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  createFolders();

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings s = webView.getSettings();

                  s.setJavaScriptEnabled(true);

                  s.setDomStorageEnabled(true);

                  s.setDatabaseEnabled(true);

                  s.setCacheMode(WebSettings.LOAD_CACHE_ELSE_NETWORK);

                  s.setAppCacheEnabled(true);

                  s.setAppCachePath(getCacheDir().getAbsolutePath());

                  s.setAllowFileAccess(true);

                  s.setAllowContentAccess(true);

                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  s.setLoadsImagesAutomatically(true);

                  s.setRenderPriority(WebSettings.RenderPriority.HIGH);

                  s.setEnableSmoothTransition(true);

                  webView.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/app2.html");

              }

              private void createFolders() {

                  String[] folders = {"EW Study Bible/Bible", "EW Study Bible/Commentary", "EW Study Bible/Notes", "EW Study Bible/Highlights", "EW Study Bible/Audio", "EW Study Bible/Downloads", "EW Study Bible/Backups"};

                  for (String f : folders) {

                      File dir = new File(getFilesDir(), f);

                      if (!dir.exists()) dir.mkdirs();

                      File ext = new File(getExternalFilesDir(null), f);

                      if (ext != null && !ext.exists()) ext.mkdirs();

                  }

              }

              @Override

              public void onBackPressed() {

                  if (webView.canGoBack()) webView.goBack();

                  else super.onBackPressed();

              }

          }

          EOF

 

          # 6. Values

          cat > app/src/main/res/values/themes.xml << 'EOF'

          <resources>

              <style name="Theme.EWStudyBible" parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:windowBackground">#0B1D4A</item>

              </style>

          </resources>

          EOF

 

      - name: Copy Assets and Icon

        run: |

          if [ -f "app2.html" ]; then

            cp app2.html app/src/main/assets/app2.html

            echo "Copied app2.html"

          else

            echo "::warning::app2.html not found in root, creating placeholder"

            echo "<html><body><h1>EW Study Bible - app2.html missing</h1></body></html>" > app/src/main/assets/app2.html

          fi

 

          # Icon handling - FIXED with fi

          if [ -f "icon.png" ]; then

            echo "Found icon.png"

            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png

            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png

            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png

            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png

            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          elif [ -f "icon.jpg" ]; then

            echo "Found icon.jpg"

            cp icon.jpg app/src/main/res/mipmap-mdpi/ic_launcher.png

            cp icon.jpg app/src/main/res/mipmap-hdpi/ic_launcher.png

            cp icon.jpg app/src/main/res/mipmap-xhdpi/ic_launcher.png

            cp icon.jpg app/src/main/res/mipmap-xxhdpi/ic_launcher.png

            cp icon.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          else

            echo "No icon found, using default Android icon"

            # Create a simple placeholder so build doesn't fail

            mkdir -p /tmp/icon

            echo "No custom icon" > /tmp/icon/placeholder.txt

          fi

 

      - name: Build APK

        run: |

          gradle assembleDebug --stacktrace

          ls -lh app/build/outputs/apk/debug/

          cp app/build/outputs/apk/debug/app-debug.apk EW-Study-Bible.apk

 

      - name: Upload APK

        uses: actions/upload-artifact@v4

        with:

          name: EW-Study-Bible-APK

          path: EW-Study-Bible.apk
