name: Build GuzikApp APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Inject AndroidX and Gradle Configurations
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Generate Core Android Framework Files Natively
        run: |
          # 1. Create directory paths for Manifest, Source code, and build files
          mkdir -p app/src/main/
          mkdir -p app/src/main/java/com/guzik/app/

          # 2. Generate a valid module-level build.gradle file
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.guzik.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.guzik.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # 3. Write a validated AndroidManifest.xml using corrected Base64 encoding
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          
          # Inject the native theme parameter explicitly into the XML
          sed -i 's|@value|@android:style/Theme.DeviceDefault.NoActionBar|g' app/src/main/AndroidManifest.xml

          # 4. Write pure native MainActivity.java using standard android.app.Activity (RAM Optimized)
          cat << 'EOF' > app/src/main/java/com/guzik/app/MainActivity.java
          package com.guzik.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  
                  // Crucial local file permissions for heavy HTML documents
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/app2.html");
              }
          }
          EOF

      - name: Create Assets Folder and Copy HTML
        run: |
          mkdir -p app/src/main/assets/
          cp app2.html app/src/main/assets/app2.html
          echo "Copied asset layout folder structures directly."

      - name: Build APK
        run: gradle :app:assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuzikApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
