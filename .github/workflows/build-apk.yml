name: Build EW Study Bible APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Inject AndroidX and Gradle Configurations
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EW Study Bible"
          include ':app'
          EOF

      - name: Generate Core Android Framework Files Natively
        run: |
          mkdir -p app/src/main/java/com/guzik/app/
          mkdir -p app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
          mkdir -p app/src/main/res/values

          # Set App Name in strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">EW Study Bible</string>
          </resources>
          EOF

          # Copy icon.png from root to all mipmap directories if it exists
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              if [ -f icon.png ]; then
                  cp icon.png "app/src/main/res/$folder/ic_launcher.png"
                  cp icon.png "app/src/main/res/$folder/ic_launcher_round.png"
              fi
          done

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.0'
          }
          android {
              namespace 'com.guzik.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.guzik.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name="com.guzik.app.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name="com.guzik.app.MainActivity$NotifReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="BIBLE_NOTIF" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/guzik/app/MainActivity.java
          package com.guzik.app;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.NotificationCompat;
          import java.util.Calendar;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  hideSystemUI();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDomStorageEnabled(true);

                  webView.addJavascriptInterface(new WebNotificationBridge(this), "AndroidNotif");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/app2.html");

                  createNotificationChannel();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemUI();
              }

              private void hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      );
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              "BIBLE_CHANNEL", "Bible Notifications", NotificationManager.IMPORTANCE_DEFAULT);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              public class WebNotificationBridge {
                  Context mContext;
                  WebNotificationBridge(Context c) { mContext = c; }

                  @JavascriptInterface
                  public void scheduleNotif(int id, int hour, int minute, String title, String message) {
                      Intent intent = new Intent(mContext, NotifReceiver.class);
                      intent.setAction("BIBLE_NOTIF");
                      intent.putExtra("id", id);
                      intent.putExtra("title", title);
                      intent.putExtra("message", message);

                      PendingIntent pi = PendingIntent.getBroadcast(
                              mContext, id, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      
                      AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                      Calendar calendar = Calendar.getInstance();
                      calendar.set(Calendar.HOUR_OF_DAY, hour);
                      calendar.set(Calendar.MINUTE, minute);
                      calendar.set(Calendar.SECOND, 0);

                      if (calendar.before(Calendar.getInstance())) {
                          calendar.add(Calendar.DATE, 1);
                      }

                      if (am != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, calendar.getTimeInMillis(), pi);
                          } else {
                              am.setExact(AlarmManager.RTC_WAKEUP, calendar.getTimeInMillis(), pi);
                          }
                      }
                  }
              }

              public static class NotifReceiver extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      int id = intent.getIntExtra("id", 0);
                      String title = intent.getStringExtra("title");
                      String message = intent.getStringExtra("message");

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(context, "BIBLE_CHANNEL")
                              .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                              .setContentTitle(title)
                              .setContentText(message)
                              .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                              .setAutoCancel(true);

                      NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.notify(id, builder.build());
                      }
                  }
              }
          }
          EOF

      - name: Create Assets Folder and Copy HTML
        run: |
          mkdir -p app/src/main/assets/
          
          if [ ! -f app2.html ]; then
              echo "<!DOCTYPE html><html><body><h1>EW Study Bible</h1><p>Welcome</p></body></html>" > app2.html
          fi

          cat << 'EOF' > script_bridge.js
          <script>
          function saveNotifTimes(){
            var vt = document.getElementById('nt-verse-time').value.split(':');
            var rt = document.getElementById('nt-rem-time').value.split(':');
            if(window.AndroidNotif){
              AndroidNotif.scheduleNotif(1, parseInt(vt[0]), parseInt(vt[1]), "📖 Daily Verse", "Open EW Study Bible for today's verse");
              AndroidNotif.scheduleNotif(2, parseInt(rt[0]), parseInt(rt[1]), "⏰ Bible Reminder", "Time to read your Bible");
            } else { alert("In APK only - test after build"); }
          }
          </script>
          </body>
          EOF
          
          sed -i 's|</body>||g' app2.html
          cat app2.html script_bridge.js > app/src/main/assets/app2.html

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
